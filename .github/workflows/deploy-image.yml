name: Generic SSH Deploy Template

on:
  workflow_call:
    inputs:
      harbor_url: # 新增：Harbor 的網址 (例如 harbor.example.com)
        required: true
        type: string
      target_host:
        description: '目標機器，可傳逗號分隔(例如 10.0.0.1,10.0.0.2) 或 JSON array 字串(例如 ["10.0.0.1","10.0.0.2"])'
        required: true
        type: string
      image_full_name:
        description: 'Docker Image 名稱 (含 Registry 路徑 tag)'
        required: true
        type: string
      container_name:
        description: '要運行的 Container 名稱'
        required: true
        type: string
      run_options:
        description: 'Docker run 的額外參數 (例如 -p 80:80 -v /data:/data)'
        required: false
        type: string
        default: ''
      environment:
        description: github env
        required: false
        type: string
        default: ''
      app_id:
        description: APP ID (APOLLO用於區分不同應用的環境變數)
        required: false
        type: string
        default: ''
      target_user:
        description: '棄用：SSH 登入的使用者名稱，請改用 secrets.target_ssh_user'
        required: false
        type: string
        default: ''
    secrets:
      target_ssh_user:
        description: 'SSH 登入的使用者名稱'
        required: true
      harbor_username:
        description: 'Harbor registry username'
        required: true
      harbor_password:
        description: 'Harbor registry password / robot-account token'
        required: true
      apollo_secret:
        description: 'Apollo Config Service secret (if needed)'
        required: false
jobs:
  normalize-target-host:
    name: Normalize target hosts input
    if: ${{ inputs.environment != 'preview' }}
    runs-on: ${{ fromJSON(inputs.environment == 'prod' && '["self-hosted","ment-gcp"]' || '["self-hosted","ment-runner"]') }}
    outputs:
      target_hosts_json: ${{ steps.normalize.outputs.target_hosts_json }}
    steps:
      - name: Normalize target_host to JSON array
        id: normalize
        shell: bash
        env:
          RAW_TARGET_HOST: ${{ inputs.target_host }}
        run: |
          python3 - << 'PY'
          import json
          import os
          import sys

          raw = os.environ.get("RAW_TARGET_HOST", "").strip()
          if not raw:
              print("target_host is required", file=sys.stderr)
              sys.exit(1)

          hosts = []
          if raw.startswith("["):
              try:
                  parsed = json.loads(raw)
              except json.JSONDecodeError as exc:
                  print(f"target_host JSON parse error: {exc}", file=sys.stderr)
                  sys.exit(1)

              if not isinstance(parsed, list):
                  print("target_host JSON must be an array", file=sys.stderr)
                  sys.exit(1)

              hosts = [str(item).strip() for item in parsed]
          else:
              hosts = [item.strip() for item in raw.split(",")]

          hosts = [item for item in hosts if item]
          if not hosts:
              print("target_host contains no valid hosts", file=sys.stderr)
              sys.exit(1)

          normalized = json.dumps(hosts, separators=(",", ":"))
          print(f"Normalized target_host: {normalized}")

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as fh:
              fh.write(f"target_hosts_json={normalized}\n")
          PY

  deploy:
    name: 🚀 Deploy Image via SSH (${{ matrix.target_host }})
    if: ${{ inputs.environment != 'preview' }}
    needs: normalize-target-host
    runs-on: ${{ fromJSON(inputs.environment == 'prod' && '["self-hosted","ment-gcp"]' || '["self-hosted","ment-runner"]') }}
    environment: ${{ inputs.environment }}
    strategy:
      fail-fast: false
      matrix:
        target_host: ${{ fromJSON(needs.normalize-target-host.outputs.target_hosts_json) }}

    steps:
      - name: Install SSH Key
        uses: shimataro/ssh-key-action@v2
        with:
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          known_hosts: "unnecessary"
          if_key_exists: replace

      - name: Deploy Image via SSH
        # 使用 Here Document (EOF) 將多行指令透過 SSH 送到遠端執行
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.target_ssh_user }}@${{ matrix.target_host }} << 'EOF'
            set -e # 遇到錯誤即停止
          
            echo "0. Login ${{ inputs.harbor_url }}"
            echo "${{ secrets.harbor_password }}" | docker login ${{ inputs.harbor_url }} \
              -u '${{ secrets.harbor_username }}' --password-stdin              

            echo "${{ secrets.harbor_username }}"
            echo "logined"
          
            echo "1. 拉取最新 Image..."
            docker pull ${{ inputs.image_full_name }}
          
            echo "2. 停止並移除舊容器 (若存在)..."
            # 加上 || true 避免容器不存在時報錯中斷流程
            docker stop ${{ inputs.container_name }} || true
          
            echo "3. 啟動新容器..."
            docker run -d \
              --name ${{ inputs.container_name }}-new \
              -e ENV_TAG=${{ inputs.environment }} \
              -e APP_ID=${{ inputs.app_id }} \
              -e APOLLO_SECRET=${{ secrets.apollo_secret }} \
              ${{ inputs.run_options }} \
              ${{ inputs.image_full_name }}
          
            docker rm ${{ inputs.container_name }} || true
            docker rename ${{ inputs.container_name }}-new ${{ inputs.container_name }} || true
          
            echo "4. 清理無用的懸空 Image (選用)..."
            docker image prune -f
          EOF
